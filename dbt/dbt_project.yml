name: 'nyc_taxi'
version: '1.0.0'
config-version: 2

profile: 'nyc_taxi'

model-paths: ["models"]
seed-paths: ["seeds"]
target-path: "target"
clean-targets:
  - "target"
  - "dbt_packages"

# Variables you can override from the command line:
#   dbt run --vars '{"start_date": "2023-01-01"}'
vars:
  start_date: '2024-01-01'
  end_date: '2025-01-01'

models:
  nyc_taxi:
    staging:
      # Views cost nothing to store and always reflect the latest raw data.
      +materialized: view
      +schema: staging
    marts:
      # Tables are physically written to disk — fast to query, which is what
      # analysts and dashboards need.
      +materialized: table
      +schema: marts

seeds:
  nyc_taxi:
    +schema: seeds
